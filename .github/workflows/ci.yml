name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend — Lint, Security & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fusiondrop
          POSTGRES_PASSWORD: fusiondrop
          POSTGRES_DB: fusiondrop_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt pytest-cov

      - name: Lint with ruff
        working-directory: backend
        run: |
          pip install ruff
          ruff check . --output-format=github

      - name: Type check with mypy
        working-directory: backend
        run: |
          pip install mypy types-passlib
          mypy . --ignore-missing-imports --no-error-summary
        continue-on-error: true  # advisory for now — flip to false once clean

      - name: Dependency vulnerability scan (pip-audit)
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --desc on
        continue-on-error: true  # advisory — flip to false after resolving known CVEs

      - name: Run tests with coverage
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://fusiondrop:fusiondrop@localhost:5432/fusiondrop_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-secret-key-32-chars-minimum-ok
          ENVIRONMENT: test
          DEBUG: "false"
        run: |
          pytest tests/ -v --asyncio-mode=auto \
            --cov=. \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=60

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          flags: backend
          name: backend-coverage

  frontend:
    name: Frontend — Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm run test -- --run

      - name: Build
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image
        run: |
          docker build \
            --file backend/Dockerfile \
            --tag fusiondrop-backend:ci-${{ github.sha }} \
            ./backend

      - name: Smoke test — container starts
        run: |
          docker run --rm -d \
            --name fd-smoke \
            -e SECRET_KEY="smoke-test-key-32-chars-minimum-ok" \
            -e ENVIRONMENT="test" \
            -e DATABASE_URL="postgresql+asyncpg://x:x@localhost/x" \
            -p 8001:8000 \
            fusiondrop-backend:ci-${{ github.sha }} \
            uvicorn backend.main:app --host 0.0.0.0 --port 8000 || true
          sleep 3
          docker stop fd-smoke 2>/dev/null || true