version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: fusiondrop_postgres
    environment:
      POSTGRES_USER: fusiondrop
      POSTGRES_PASSWORD: fusiondrop
      POSTGRES_DB: fusiondrop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fusiondrop"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fusiondrop_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend                          # ← source code
      dockerfile: ../docker/backend.Dockerfile    # ← Dockerfile location
    container_name: fusiondrop_backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend                         # ← source code
      dockerfile: ../docker/frontend.Dockerfile   # ← Dockerfile location
    container_name: fusiondrop_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000

volumes:
  postgres_data:
  redis_data: